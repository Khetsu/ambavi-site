<!doctype html>

     საერთო ძრავა (ენა, მუსიკა, ეფექტები, უკუთვლა, RSVP): js/core.js ... ან საიტზე assets/core/ -->
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ნათია & დავითი · 18 სექტემბერი 2027</title>
<meta name="description" content="ნათია და დავითის საქორწილო მოსაწვევი · 18 სექტემბერი 2027, კახეთი">
<meta name="theme-color" content="#F6F1E7">
<meta property="og:title" content="ნათია & დავითი · 18.09.2027">
<meta property="og:description" content="საქორწილო მოსაწვევი">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+Georgian:wght@200;300;400;500&family=Noto+Sans+Georgian:wght@400;500;600&display=swap">

<script>document.documentElement.classList.add("js")</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

    <pattern id="satinG" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="4" height="4" fill="#5F7A55"/><path d="M0 1h4" stroke="#7E9A6E" stroke-width="1.4"/></pattern>
    <pattern id="satinD" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="4" height="4" fill="#3F5A3E"/><path d="M0 1h4" stroke="#5B7A55" stroke-width="1.4"/></pattern>
    <pattern id="satinW" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="4" height="4" fill="#F7F1E4"/><path d="M0 1h4" stroke="#FFFFFF" stroke-width="1.4"/></pattern>
    <pattern id="satinP" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="4" height="4" fill="#E2B7A6"/><path d="M0 1h4" stroke="#EECDBF" stroke-width="1.4"/></pattern>
    <pattern id="satinR" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="4" height="4" fill="#9FB0B8"/><path d="M0 1h4" stroke="#B9C7CD" stroke-width="1.4"/></pattern>
    <pattern id="satinB" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)"><rect width="4" height="4" fill="#8A6A48"/><path d="M0 1h4" stroke="#A8865F" stroke-width="1.4"/></pattern>
    <radialGradient id="pearl" cx=".35" cy=".3"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#F1E9D8"/><stop offset="1" stop-color="#B5A47F"/></radialGradient>
    <filter id="raise" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="1.2" stdDeviation=".8" flood-color="#6B5634" flood-opacity=".35"/></filter>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E7CF9A"/><stop offset="1" stop-color="#B8893F"/></linearGradient>
  </defs>
  <!-- arched garden window with open shutters (embroidered) -->
  <symbol id="arch-door" viewBox="0 0 200 220">
    <g filter="url(#raise)">
      <path d="M40 210V100a60 60 0 0 1 120 0v110z" fill="url(#satinD)"/>
      <path d="M52 204V102a48 48 0 0 1 96 0v102z" fill="#FBF3E0"/>

      <g fill="none" stroke="#E9E1CC" stroke-width="1" stroke-dasharray="2.5 2"><path d="M26 112l20 4v84l-20-4zM174 112l-20 4v84l20-4zM26 150l20 2M174 150l-20 2"/></g>
      <path d="M100 54v150M52 140h96" stroke="#7E9A6E" stroke-width="3"/>
      <path d="M34 210h132v8H34z" fill="url(#satinW)"/>
      <g fill="url(#pearl)"><circle cx="60" cy="58" r="4"/><circle cx="100" cy="38" r="4"/><circle cx="140" cy="58" r="4"/></g>
      <g><circle cx="70" cy="46" r="9" fill="url(#satinP)"/><circle cx="100" cy="30" r="10" fill="url(#satinW)"/><circle cx="130" cy="46" r="9" fill="url(#satinP)"/><circle cx="48" cy="72" r="7" fill="url(#satinW)"/><circle cx="152" cy="72" r="7" fill="url(#satinW)"/></g>
      <g fill="url(#satinG)"><ellipse cx="84" cy="38" rx="8" ry="4" transform="rotate(-20 84 38)"/><ellipse cx="116" cy="38" rx="8" ry="4" transform="rotate(20 116 38)"/><ellipse cx="56" cy="60" rx="7" ry="3.5" transform="rotate(-50 56 60)"/><ellipse cx="144" cy="60" rx="7" ry="3.5" transform="rotate(50 144 60)"/></g>
    </g>
  </symbol>
  <!-- dress code: gown and suit on hangers -->
  <symbol id="hangers" viewBox="0 0 260 200">
    <g fill="none" stroke="#B8893F" stroke-width="2" stroke-linecap="round"><path d="M70 22a7 7 0 1 1 7 7v5l-34 16h68l-34-16"/><path d="M190 22a7 7 0 1 1 7 7v5l-34 16h68l-34-16"/></g>
    <g filter="url(#raise)">
      <path d="M62 52h30l6 30c18 30 30 70 36 112H22c6-42 18-82 36-112z" fill="url(#satinW)"/>
      <path d="M58 84h44" stroke="#E7CF9A" stroke-width="3"/>
      <g fill="url(#pearl)"><circle cx="64" cy="84" r="2.6"/><circle cx="72" cy="84" r="2.6"/><circle cx="80" cy="84" r="2.6"/><circle cx="88" cy="84" r="2.6"/><circle cx="96" cy="84" r="2.6"/></g>
      <path d="M62 52h30l6 30c18 30 30 70 36 112H22c6-42 18-82 36-112z" fill="none" stroke="#D8CBB0" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M170 52h40l14 20 4 120h-76l4-120z" fill="url(#satinD)"/>
      <path d="M180 52l10 40 10-40" fill="#FBF6EA"/><path d="M182 60l8 6 8-6-8 4z" fill="#2F3B2C"/><path d="M190 92v100" stroke="#2F3B2C" stroke-width="1" stroke-dasharray="3 2"/>
      <g fill="#E7CF9A"><circle cx="196" cy="110" r="2"/><circle cx="196" cy="130" r="2"/></g>
      <path d="M170 52h40l14 20 4 120h-76l4-120z" fill="none" stroke="#8FA38A" stroke-width="1" stroke-dasharray="3 2"/>
    </g>
  </symbol>
  <!-- the estate (embroidered château) -->
  <symbol id="estate" viewBox="0 0 400 240">
    <g filter="url(#raise)">
      <g fill="url(#satinD)"><path d="M20 170c-10-50 2-110 12-130 10 20 22 80 12 130z"/><path d="M56 170c-8-40 2-90 10-108 8 18 18 68 10 108z"/><path d="M332 170c-8-40 2-90 10-108 8 18 18 68 10 108z"/><path d="M366 170c-10-50 2-110 12-130 10 20 22 80 12 130z"/></g>
      <g fill="url(#satinG)"><circle cx="100" cy="120" r="26"/><circle cx="300" cy="120" r="26"/></g>
      <rect x="96" y="96" width="208" height="92" fill="url(#satinP)"/>
      <path d="M90 98l14-22h192l14 22z" fill="url(#satinR)"/>
      <rect x="120" y="56" width="34" height="132" fill="url(#satinP)"/><path d="M116 58l21-30 21 30z" fill="url(#satinR)"/>
      <rect x="246" y="56" width="34" height="132" fill="url(#satinP)"/><path d="M242 58l21-30 21 30z" fill="url(#satinR)"/>
      <path d="M176 188v-46a24 24 0 0 1 48 0v46z" fill="url(#satinW)"/>
      <g fill="#F7F1E4" stroke="#C99A86" stroke-width=".8"><rect x="128" y="76" width="18" height="22" rx="8"/><rect x="128" y="112" width="18" height="22" rx="8"/><rect x="128" y="148" width="18" height="22" rx="8"/><rect x="254" y="76" width="18" height="22" rx="8"/><rect x="254" y="112" width="18" height="22" rx="8"/><rect x="254" y="148" width="18" height="22" rx="8"/>
        <rect x="166" y="108" width="14" height="20" rx="6"/><rect x="220" y="108" width="14" height="20" rx="6"/><rect x="192" y="104" width="16" height="22" rx="7"/></g>
      <g fill="none" stroke="#FBF3E0" stroke-width="1" stroke-dasharray="3 2"><path d="M96 96h208v92H96zM120 56h34v40M246 56h34v40"/></g>
      <path d="M0 188h400v52H0z" fill="url(#satinG)"/>
      <path d="M0 196c40-8 80-8 120 0s80 8 120 0 80-8 120 0 40 8 40 8" fill="none" stroke="#9FB48E" stroke-width="2" stroke-dasharray="4 3"/>
      <g fill="url(#pearl)"><circle cx="30" cy="214" r="3.5"/><circle cx="62" cy="222" r="3"/><circle cx="96" cy="212" r="3.5"/><circle cx="140" cy="224" r="3"/><circle cx="260" cy="222" r="3"/><circle cx="304" cy="212" r="3.5"/><circle cx="338" cy="222" r="3"/><circle cx="370" cy="214" r="3.5"/></g>
      <g fill="url(#satinP)"><circle cx="46" cy="216" r="4"/><circle cx="118" cy="216" r="4"/><circle cx="282" cy="216" r="4"/><circle cx="354" cy="216" r="4"/></g>
      <path d="M176 240l14-52h20l14 52z" fill="url(#satinW)"/>
    </g>
  </symbol>
  <!-- embossed flowers for the wishes envelope -->
  <symbol id="emboss" viewBox="0 0 120 80">
    <g fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round">
      <path d="M60 40c-10-14-26-14-30-4 10 0 20 2 30 4zm0 0c10-14 26-14 30-4-10 0-20 2-30 4zm0 0c-12 10-14 24-6 28 2-10 4-20 6-28zm0 0c12 10 14 24 6 28-2-10-4-20-6-28z"/>
      <circle cx="60" cy="40" r="4"/>
      <path d="M20 66c10-10 20-12 30-10M100 66c-10-10-20-12-30-10M14 20c10 6 16 14 18 22M106 20c-10 6-16 14-18 22"/>
      <path d="M22 60c-4-4-2-10 4-10M98 60c4-4 2-10-4-10"/>
    </g>
  </symbol>
</svg>

<!-- ============ GATE: closed pearl curtain ============ -->
<div class="gate" id="gate" role="button" tabindex="0" aria-label="მოსაწვევის გახსნა"
     data-stages="s1:0,s2:380,s3:2300" data-open="2750" data-burst="400:sparkle:#g-tie:40" hidden>
  <canvas class="g-half l" data-curtain="full" aria-hidden="true"></canvas>
  <canvas class="g-half r" data-curtain="full" aria-hidden="true"></canvas>
  <canvas class="g-val" data-curtain="valance" aria-hidden="true"></canvas>
  <div class="g-tie" id="g-tie" aria-hidden="true"><b data-t="monogram"></b></div>
  <p class="g-pill"><span data-i18n="tapHint"></span><span class="arrow">↓</span></p>
</div>
<script>try{document.getElementById("gate").hidden=false;document.documentElement.classList.add("gated")}catch(e){}</script>

<main>
  <!-- ============ STAGE ============ -->
  <header class="stage">
    <canvas class="panel l" data-curtain="side" aria-hidden="true"></canvas>
    <canvas class="panel r" data-curtain="side" aria-hidden="true"></canvas>
    <canvas class="valance" data-curtain="valance" aria-hidden="true"></canvas>
    <div class="chandelier" id="chandelier" aria-hidden="true"></div>
    <div class="name-card hx" style="--d:.7">
      <p class="nc-names" data-letters="host" style="--ch0:1s"></p>
      <p class="nc-script" data-t="script"></p>
      <p class="nc-invite" data-t="invite"></p>
      <p class="nc-date"><i></i><span data-t="shortDate"></span><i></i></p>
    </div>
    <div class="garden hx" id="garden" data-art="images/garden.jpg" style="--d:1.2;--hx:hx-fade" aria-hidden="true"></div>
    <a class="pill next hx" style="--d:2" href="#cd"><span data-i18n="next"></span><span class="arrow">↓</span></a>
  </header>

  <div class="lights" id="lights" aria-hidden="true"></div>

  <!-- ============ COUNTDOWN ============ -->
  <section class="band" id="cd">
    <div class="wrap">
      <p class="label" data-anim="up" data-i18n="cdTitle"></p>
      <div class="count soft" id="count" data-anim="flip"></div>
      <p class="lead" data-anim="up" data-t="lead"></p>
      <div class="ctas" data-anim="up" data-ctas></div>
    </div>
  </section>

  <!-- ============ STORY in embroidery hoops ============ -->
  <section class="band" data-section="story">
    <div class="wrap">
      <div class="head" data-anim="up"><h2 data-i18n="storyTitle"></h2><p class="sub" data-t="storyIntro"></p></div>
      <div class="story" id="story"></div>
    </div>
  </section>

  <!-- ============ SCHEDULE ============ -->
  <section class="band" data-section="events">
    <div class="wrap">
      <figure class="art arch-art" data-art="images/arch.jpg" data-anim="zoom"><svg class="emb arch" aria-hidden="true"><use href="#arch-door"/></svg></figure>
      <div class="head" data-anim="up"><h2 data-i18n="dayTitle"></h2><p class="sub" data-t="venue"></p></div>
      <ol class="day" id="day"></ol>
    </div>
  </section>

  <!-- ============ DRESS CODE ============ -->
  <section class="band">
    <div class="wrap">
      <div class="head" data-anim="up"><h2 data-i18n="dressTitle"></h2><p class="sub" data-t="dressCode"></p></div>
      <figure class="art dress-art" data-art="images/dress-code.jpg" data-anim="zoom"><svg class="emb hangers" aria-hidden="true"><use href="#hangers"/></svg></figure>
      <div class="palette" id="palette" data-anim="up"></div>
      <p class="note" data-anim="up" data-t="dressNote"></p>
    </div>
  </section>

  <!-- ============ LOCATION ============ -->
  <section class="band">
    <div class="wrap">
      <div class="head" data-anim="up"><h2 data-i18n="locTitle"></h2><p class="sub" data-t="address"></p></div>
      <figure class="art venue-art" data-art="images/venue.jpg" data-anim="zoom"><svg class="emb estate" aria-hidden="true"><use href="#estate"/></svg></figure>
      <p class="note" data-anim="up" data-t="parking"></p>
      <a class="pill dark" id="map-btn" href="#" target="_blank" rel="noopener" data-anim="up"><svg><use href="#i-pin"/></svg><span data-i18n="mapBtn"></span></a>
    </div>
  </section>

  <!-- ============ GALLERY ============ -->
  <section class="band" data-section="photos">
    <div class="wrap">
      <div class="head" data-anim="up"><h2 data-i18n="galTitle"></h2></div>
      <ul class="hoops" id="gallery"></ul>
    </div>
  </section>

  <!-- ============ RSVP ============ -->
  <section class="band" id="rsvp">
    <div class="wrap">
      <div class="rsvp card" id="rsvp-box" data-anim="flip"><h2 class="card-title" data-i18n="rsvpTitle"></h2></div>
    </div>
  </section>

  <!-- ============ WISHES ENVELOPE ============ -->
  <section class="band">
    <div class="wrap">
      <div class="head" data-anim="up"><h2 data-i18n="wishTitle"></h2><p class="sub" data-i18n="wishSub"></p></div>
      <div class="wenv" id="wenv" role="button" tabindex="0" data-anim="zoom" aria-controls="wish-form">
        <div class="w-back"></div>
        <div class="w-card"><span class="w-script">Wishes</span><svg><use href="#i-heart"/></svg></div>
        <div class="w-front"><svg class="w-emb a"><use href="#emboss"/></svg><svg class="w-emb b"><use href="#emboss"/></svg></div>
        <div class="w-flap"><svg class="w-emb c"><use href="#emboss"/></svg></div>
      </div>
      <form class="wish-form card" id="wish-form" hidden>
        <input class="input" id="w-name" type="text" autocomplete="name" data-i18n-ph="wishName">
        <textarea class="textarea" id="w-text" data-i18n-ph="wishPh"></textarea>
        <div class="send"><a class="btn wa" id="w-wa" href="#" target="_blank" rel="noopener"><svg><use href="#i-wa"/></svg><span data-i18n="wishSend"></span></a><button type="button" class="btn copy" id="w-copy"><svg><use href="#i-copy"/></svg><span id="w-copy-label" data-i18n="wishCopy"></span></button></div>
      </form>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap" data-anim="up">
    <p class="f-names" data-t="host"></p>
    <p class="f-when"><span data-t="dots"></span> · <span data-t="venue"></span></p>
    <p class="brand" data-i18n="brand"></p>
  </div>
  <div class="f-garden" id="f-garden" aria-hidden="true"></div>
</footer>

<template id="tpl-story"><article class="chapter" data-anim="up"><div class="hoop"><div class="hoop-in kb" data-f="photo"></div></div><div class="cp-body"><span class="cp-year" data-f="year"></span><span class="cp-season" data-f="season"></span><h3 data-f="title"></h3><p data-f="text"></p></div></article></template>
<template id="tpl-event"><li class="ev" data-anim="flip"><span class="ev-time" data-f="time"></span><div class="ev-body"><h3 data-f="title"></h3><p class="ev-note" data-f="note"></p><a class="ev-map" data-f="map"><svg><use href="#i-pin"/></svg><span data-f="maptext"></span></a></div></li></template>
<template id="tpl-photo"><li class="hoop small" data-anim="zoom"><div class="hoop-in kb" data-f="photo"></div></li></template>

<script src="js/config.js"></script>
<script src="../../assets/core/js/i18n.js"></script>
<script src="../../assets/core/js/icons.js"></script>
<script src="../../assets/core/js/fx.js"></script>
<script src="../../assets/core/js/music.js"></script>
<script src="../../assets/3d/js/theme.js"></script>
<script src="../../assets/core/js/core.js"></script>
<script src="../../assets/3d/js/stage3d.js"></script>
<script src="../../assets/3d/js/emb3d.js"></script>
</body>
</html>
