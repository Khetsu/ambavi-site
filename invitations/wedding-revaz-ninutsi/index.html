<!doctype html>
<!-- ამბავი · მოსაწვევი „wedding-revaz-ninutsi“
     ტექსტები და მონაცემები: js/config.js · დიზაინის სტილი: css/theme.css · ილუსტრაციები: images/art/
     საერთო ძრავა (ენა, მუსიკა, ეფექტები, უკუთვლა, RSVP): js/core.js ... ან საიტზე assets/core/ -->
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>რევაზ & ნინუცი · 15 მაისი 2027</title>
<meta name="description" content="რევაზ და ნინუცის საქორწილო მოსაწვევი · 15 მაისი 2027, მცხეთა">
<meta name="theme-color" content="#FBFAF5">
<meta property="og:title" content="რევაზ & ნინუცი · 15.05.2027">
<meta property="og:description" content="საქორწილო მოსაწვევი">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Pinyon+Script&family=Noto+Serif+Georgian:wght@300;400;500&family=Noto+Sans+Georgian:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../assets/core/css/base.css">
<link rel="stylesheet" href="css/theme.css">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>

<div class="washes" aria-hidden="true"><i class="w1"></i><i class="w2"></i><i class="w3"></i><i class="w4"></i></div>

<!-- ============ GATE: a card under vellum, tied with a ribbon ============ -->
<div class="gate" id="gate" role="button" tabindex="0" aria-label="მოსაწვევის გახსნა"
     data-stages="s1:0,s2:550,s3:1500" data-open="2300" data-burst="300:petals:#bow:40" hidden>
  <div class="g-card">
    <svg class="wreath" data-wreath data-r="104" viewBox="0 0 300 300" aria-hidden="true"></svg>
    <div class="g-mid"><b class="g-mono" data-t="monogram"></b><span class="g-names" data-t="host"></span><span class="g-date" data-t="dots"></span></div>
  </div>
  <div class="vellum" aria-hidden="true">
    <span class="twine"></span>
    <svg class="bow" id="bow" viewBox="0 0 120 80"><path d="M60 40C40 18 14 14 10 30s20 26 50 10zM60 40c20-22 46-26 50-10s-20 26-50 10z" fill="#E8C3BB" stroke="#C99187" stroke-width="1.4"/><path d="M58 42l-16 34 8-2 6 6 6-36zM62 42l16 34-8-2-6 6-6-36z" fill="#F0D3CC" stroke="#C99187" stroke-width="1.2"/><circle cx="60" cy="40" r="7" fill="#D9A8A0" stroke="#C99187" stroke-width="1.4"/></svg>
  </div>
  <p class="g-hint"><svg><use href="#i-note"/></svg><span data-i18n="tapHint"></span></p>
</div>
<script>try{document.getElementById("gate").hidden=false;document.documentElement.classList.add("gated")}catch(e){}</script>

<main>
  <!-- ============ HERO ============ -->
  <header class="hero">
    <svg class="sprig tl" data-sprig viewBox="0 0 260 200" aria-hidden="true"></svg>
    <svg class="sprig tr" data-sprig viewBox="0 0 260 200" aria-hidden="true"></svg>
    <div class="wrap hero-in">
      <p class="kicker hx" style="--d:.2">Together with their families</p>
      <div class="h-wreath hx" style="--d:.3;--hx:hx-zoom">
        <svg class="wreath" data-wreath data-r="112" viewBox="0 0 300 300" aria-hidden="true"></svg>
        <span class="h-mono" data-t="monogram"></span>
      </div>
      <h1 class="names hx" style="--d:.9" data-t="script"></h1>
      <p class="geo-names" data-letters="host" style="--ch0:1.3s"></p>
      <p class="date-line hx" style="--d:1.6"><span data-t="weekday"></span><i></i><b data-t="dots"></b><i></i><span data-t="city"></span></p>
      <p class="lead hx" style="--d:1.8" data-t="lead"></p>
      <div class="ctas hx" style="--d:2" data-ctas></div>
    </div>
  </header>

  <!-- ============ COUNTDOWN ============ -->
  <section class="band" id="cd">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script">Save the date</span><h2 data-i18n="cdTitle"></h2><span class="leaves" aria-hidden="true"></span></div>
      <div class="count" id="count" data-anim="zoom"></div>
    </div>
  </section>

  <!-- ============ STORY ============ -->
  <section class="band" data-section="story">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script">Our story</span><h2 data-i18n="storyTitle"></h2><span class="leaves" aria-hidden="true"></span><p class="sub" data-t="storyIntro"></p></div>
      <div class="story" id="story"></div>
    </div>
  </section>

  <!-- ============ SCHEDULE ============ -->
  <section class="band" data-section="events">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script">The day</span><h2 data-i18n="dayTitle"></h2><span class="leaves" aria-hidden="true"></span></div>
      <ol class="vine" id="day"></ol>
    </div>
  </section>

  <!-- ============ DETAILS ============ -->
  <section class="band" data-section="details">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script">Good to know</span><h2 data-i18n="detailsTitle"></h2><span class="leaves" aria-hidden="true"></span></div>
      <div class="details" id="details"></div>
      <div class="palette" data-anim="up" aria-hidden="true"><i style="--c:#A9BFA2"></i><i style="--c:#6F8F6A"></i><i style="--c:#A9BDD0"></i><i style="--c:#F0D3CC"></i><i style="--c:#F6F1E6"></i></div>
    </div>
  </section>

  <!-- ============ LOCATION ============ -->
  <section class="band" id="where">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script">The garden</span><h2 data-i18n="locTitle"></h2><span class="leaves" aria-hidden="true"></span></div>
      <div class="place" data-anim="zoom">
        <svg class="garden" viewBox="0 0 400 200" aria-hidden="true">
          <defs><filter id="wc" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter></defs>
          <g filter="url(#wc)">
            <rect width="400" height="200" fill="#EEF2EA"/>
            <ellipse cx="300" cy="44" rx="40" ry="26" fill="#F6E3C8" opacity=".9"/>
            <path d="M0 120C80 96 160 110 240 100S360 92 400 104V200H0z" fill="#C9D8C0"/>
            <path d="M0 150C90 132 210 146 400 132V200H0z" fill="#A9BFA2"/>
            <g fill="#7E9C78" opacity=".92"><ellipse cx="70" cy="96" rx="34" ry="26"/><ellipse cx="96" cy="84" rx="26" ry="20"/><ellipse cx="320" cy="92" rx="36" ry="27"/><ellipse cx="346" cy="80" rx="24" ry="18"/><ellipse cx="200" cy="88" rx="30" ry="22"/></g>
            <g stroke="#8A7458" stroke-width="5" stroke-linecap="round"><path d="M80 120v-20M330 118v-20M200 112v-16"/></g>
            <path d="M120 150h160" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
            <g fill="#F0D3CC"><circle cx="40" cy="160" r="5"/><circle cx="52" cy="166" r="4"/><circle cx="352" cy="164" r="5"/><circle cx="364" cy="158" r="4"/><circle cx="160" cy="170" r="4"/><circle cx="246" cy="172" r="4"/></g>
            <g fill="#A9BDD0"><circle cx="30" cy="172" r="3.5"/><circle cx="372" cy="172" r="3.5"/><circle cx="210" cy="176" r="3"/></g>
          </g>
          <g class="lanterns" fill="#F6D58E"><circle cx="130" cy="120" r="4"/><circle cx="170" cy="126" r="4"/><circle cx="230" cy="126" r="4"/><circle cx="270" cy="120" r="4"/></g>
          <path d="M110 112Q150 132 200 126T290 112" fill="none" stroke="#8A7458" stroke-width="1"/>
        </svg>
        <h3 class="pl-name" data-t="venue"></h3>
        <p class="pl-addr" data-t="address"></p>
        <a class="btn solid" id="map-btn" href="#" target="_blank" rel="noopener"><svg><use href="#i-pin"/></svg><span data-i18n="mapBtn"></span></a>
      </div>
    </div>
  </section>

  <!-- ============ RSVP ============ -->
  <section class="band" id="rsvp">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script">Will you join us?</span><h2 data-i18n="rsvpTitle"></h2><span class="leaves" aria-hidden="true"></span></div>
      <div class="rsvp card" id="rsvp-box" data-anim="up">
        <svg class="sprig c1" data-sprig viewBox="0 0 260 200" aria-hidden="true"></svg>
        <svg class="sprig c2" data-sprig viewBox="0 0 260 200" aria-hidden="true"></svg>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap" data-anim="up">
    <div class="f-wreath"><svg class="wreath" data-wreath data-r="104" viewBox="0 0 300 300" aria-hidden="true"></svg><span data-t="monogram"></span></div>
    <p class="toast" data-t="toast"></p>
    <p class="sign" data-t="script"></p>
    <p class="when" data-t="dots"></p>
    <p class="brand" data-i18n="brand"></p>
  </div>
</footer>

<template id="tpl-story"><article class="chapter" data-anim="up"><div class="cp-photo" data-f="photo"></div><div class="cp-body"><span class="cp-year" data-f="year"></span><span class="cp-season" data-f="season"></span><h3 data-f="title"></h3><p data-f="text"></p></div></article></template>
<template id="tpl-event"><li class="ev" data-anim="up"><span class="ev-leaf" aria-hidden="true"></span><span class="ev-time" data-f="time"></span><div class="ev-body"><h3 data-f="title"></h3><p data-f="place"></p><a class="ev-map" data-f="map"><svg><use href="#i-pin"/></svg><span data-f="maptext"></span></a></div><span class="ev-ic"><svg data-f="icon"><use href="#i-star"/></svg></span></li></template>
<template id="tpl-detail"><div class="detail" data-anim="up"><span class="d-ic"><svg data-f="icon"><use href="#i-star"/></svg></span><h3 data-f="label"></h3><p data-f="value"></p></div></template>

<script src="js/config.js"></script>
<script src="../../assets/core/js/i18n.js"></script>
<script src="../../assets/core/js/icons.js"></script>
<script src="../../assets/core/js/fx.js"></script>
<script src="../../assets/core/js/music.js"></script>
<script src="js/botanic.js"></script>
<script src="../../assets/core/js/core.js"></script>
<script>
/* რუკის ღილაკი: mapUrl ან მისამართი Google Maps-ში */
(function(){ var C = window.CONFIG, b = document.getElementById("map-btn"); if (!b) return;
  function L(v){ return v && typeof v === "object" ? (document.documentElement.lang === "en" ? v.en : v.ka) : (v || ""); }
  function upd(){ b.href = C.mapUrl || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(L(C.address)); }
  upd(); b.addEventListener("click", upd); })();
</script>
</body>
</html>
