<!doctype html>
<!-- ამბავი · მოსაწვევი „engagement-giorgi-nino“
     ტექსტები და მონაცემები: js/config.js · დიზაინის სტილი: css/theme.css · ილუსტრაციები: images/art/
     საერთო ძრავა (ენა, მუსიკა, ეფექტები, უკუთვლა, RSVP): js/core.js ... ან საიტზე assets/core/ -->
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>გიორგი და ნინო · ნიშნობის მოსაწვევი</title>
<meta name="description" content="გიორგი და ნინოს ნიშნობის მოსაწვევი · 14 თებერვალი 2027, თბილისი">
<meta name="theme-color" content="#FCE9E4">
<meta property="og:title" content="გიორგი & ნინო · 14.02.2027">
<meta property="og:description" content="ნიშნობის მოსაწვევი">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+Georgian:wght@300;400;500&family=Noto+Sans+Georgian:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../assets/core/css/base.css">
<link rel="stylesheet" href="css/theme.css">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBE3D8"/><stop offset=".45" stop-color="#D9A28E"/><stop offset="1" stop-color="#A8665A"/></linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4B6C2"/><stop offset="1" stop-color="#C25B6F"/></linearGradient>
    <radialGradient id="roseA"><stop offset="0" stop-color="#FDE3E8"/><stop offset="1" stop-color="#E99AAA"/></radialGradient>
    <radialGradient id="roseB"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6CDD5"/></radialGradient>
    <radialGradient id="roseC"><stop offset="0" stop-color="#FBD9C9"/><stop offset="1" stop-color="#E7A68F"/></radialGradient>
  </defs>
  <!-- watercolor rose spray -->
  <symbol id="flora" viewBox="0 0 160 120">
    <g fill="#9FB495"><ellipse cx="34" cy="70" rx="20" ry="8" transform="rotate(-30 34 70)"/><ellipse cx="120" cy="34" rx="18" ry="7" transform="rotate(25 120 34)"/><ellipse cx="96" cy="92" rx="18" ry="7" transform="rotate(-15 96 92)"/></g>
    <g fill="#B8C9AD"><ellipse cx="58" cy="96" rx="16" ry="6" transform="rotate(20 58 96)"/><ellipse cx="138" cy="70" rx="15" ry="6" transform="rotate(-40 138 70)"/><ellipse cx="22" cy="40" rx="14" ry="5" transform="rotate(40 22 40)"/></g>
    <circle cx="70" cy="58" r="26" fill="url(#roseA)"/><path d="M70 58m-6 0a6 6 0 1 1 12 0a10 10 0 1 1-20 0a15 15 0 1 1 30 0" fill="none" stroke="#C9687C" stroke-width="1.6" stroke-opacity=".55"/>
    <circle cx="112" cy="62" r="18" fill="url(#roseB)"/><path d="M112 62m-4 0a4 4 0 1 1 8 0a7 7 0 1 1-14 0a11 11 0 1 1 22 0" fill="none" stroke="#E3A3B0" stroke-width="1.4" stroke-opacity=".7"/>
    <circle cx="42" cy="30" r="14" fill="url(#roseC)"/><path d="M42 30m-3 0a3 3 0 1 1 6 0a6 6 0 1 1-12 0" fill="none" stroke="#C98270" stroke-width="1.3" stroke-opacity=".6"/>
    <g fill="#F4B6C2"><circle cx="140" cy="44" r="5"/><circle cx="16" cy="78" r="4"/><circle cx="92" cy="22" r="4"/></g>
  </symbol>
  <symbol id="divider" viewBox="0 0 240 30">
    <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M0 15H92M148 15H240" stroke-opacity=".5"/><path d="M120 24c-14-8-20-16-12-20 5-2 10 1 12 5 2-4 7-7 12-5 8 4 2 12-12 20z" fill="currentColor" fill-opacity=".2"/></g>
    <g fill="currentColor"><circle cx="100" cy="15" r="2"/><circle cx="140" cy="15" r="2"/></g>
  </symbol>
  <symbol id="ring-art" viewBox="0 0 100 100">
    <ellipse cx="50" cy="66" rx="27" ry="22" fill="none" stroke="url(#rg)" stroke-width="8"/>
    <ellipse cx="50" cy="66" rx="27" ry="22" fill="none" stroke="#FFF4EC" stroke-width="1.6" stroke-dasharray="22 140" stroke-dashoffset="-6" opacity=".9"/>
    <path d="M38 40h24l-12 16z" fill="#E9F3FF"/><path d="M38 40l6-9h12l6 9z" fill="#FFFFFF"/>
    <path d="M38 40h24M44 31l-6 9 12 16 12-16-6-9M50 31v25" fill="none" stroke="#A9C3E0" stroke-width="1"/>
    <path d="M47 36l3-3 3 3" fill="none" stroke="#fff" stroke-width="1.2"/>
  </symbol>
</svg>

<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- ============ GATE: velvet ring box ============ -->
<div class="gate" id="gate" role="button" tabindex="0" aria-label="მოსაწვევის გახსნა"
     data-stages="s1:0,s2:550,s3:1250,s4:2500" data-open="3200" data-burst="1300:hearts:#ring:34;1350:sparkle:#ring:44" hidden>
  <div class="g-text">
    <span class="g-script rg-foil">She said yes</span>
    <span class="g-names" data-t="host"></span>
    <span class="g-date" data-t="dots"></span>
  </div>
  <div class="box" aria-hidden="true">
    <div class="lining"><b data-t="monogram"></b></div>
    <div class="cushion"></div>
    <div class="ring" id="ring"><svg viewBox="0 0 100 100"><use href="#ring-art"/></svg></div>
    <div class="base"></div>
    <div class="lid"></div>
  </div>
  <p class="g-hint"><svg><use href="#i-heart"/></svg><span data-i18n="tapHint"></span></p>
</div>
<script>try{document.getElementById("gate").hidden=false;document.documentElement.classList.add("gated")}catch(e){}</script>

<main>
  <!-- ============ HERO ============ -->
  <header class="hero">
    <div class="wrap hero-in">
      <p class="kicker hx" style="--d:.1">We're engaged</p>
      <div class="portrait hx" style="--d:.3;--hx:hx-zoom">
        <svg class="ring-text" viewBox="0 0 300 300" aria-hidden="true"><defs><path id="circ" d="M150 150m-132 0a132 132 0 1 1 264 0a132 132 0 1 1-264 0"/></defs><text><textPath href="#circ" data-t="ringText"></textPath></text></svg>
        <div class="portrait-photo kb" data-photo="hero" data-tap="hearts"></div>
        <svg class="flora f1"><use href="#flora"/></svg>
        <svg class="flora f2"><use href="#flora"/></svg>
      </div>
      <h1 class="script-names rg-foil hx" style="--d:.7" data-t="script"></h1>
      <p class="geo-names" data-letters="host" style="--ch0:1.1s"></p>
      <div class="date-pill hx" style="--d:1.5"><span data-t="weekday"></span><i></i><b data-t="dayNum"></b><span data-t="month"></span><i></i><span data-t="year"></span></div>
      <p class="where hx" style="--d:1.7"><svg><use href="#i-pin"/></svg><span data-t="city"></span></p>
      <p class="lead hx" style="--d:1.9" data-t="lead"></p>
      <div class="ctas hx" style="--d:2.1" data-ctas></div>
    </div>
  </header>

  <!-- ============ STORY ============ -->
  <section class="band" data-section="story">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script rg-foil">Our story</span><h2 data-i18n="storyTitle"></h2><svg class="divider"><use href="#divider"/></svg><p class="sub" data-t="storyIntro"></p></div>
      <div class="story" id="story"></div>
    </div>
  </section>

  <!-- ============ COUNTDOWN ============ -->
  <section class="band soft">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script rg-foil">Save the date</span><h2 data-i18n="cdTitle"></h2><svg class="divider"><use href="#divider"/></svg></div>
      <div class="count" id="count" data-rings data-anim="zoom"></div>
    </div>
  </section>

  <!-- ============ SCHEDULE ============ -->
  <section class="band" data-section="events">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script rg-foil">The evening</span><h2 data-i18n="dayTitle"></h2><svg class="divider"><use href="#divider"/></svg></div>
      <ol class="program" id="day"></ol>
    </div>
  </section>

  <!-- ============ DETAILS ============ -->
  <section class="band soft" data-section="details">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script rg-foil">Good to know</span><h2 data-i18n="detailsTitle"></h2><svg class="divider"><use href="#divider"/></svg></div>
      <div class="details" id="details"></div>
    </div>
  </section>

  <!-- ============ GALLERY ============ -->
  <section class="band" data-section="photos">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script rg-foil">Moments</span><h2 data-i18n="galTitle"></h2><svg class="divider"><use href="#divider"/></svg></div>
      <ul class="gallery" id="gallery"></ul>
    </div>
  </section>

  <!-- ============ RSVP ============ -->
  <section class="band soft" id="rsvp">
    <div class="wrap">
      <div class="head" data-anim="up"><span class="script rg-foil">Will you come?</span><h2 data-i18n="rsvpTitle"></h2><svg class="divider"><use href="#divider"/></svg></div>
      <div class="rsvp card" id="rsvp-box" data-anim="up"><svg class="flora c1"><use href="#flora"/></svg><svg class="flora c2"><use href="#flora"/></svg></div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap" data-anim="up">
    <svg class="flora foot-flora"><use href="#flora"/></svg>
    <p class="toast" data-t="toast"></p>
    <p class="sign rg-foil" data-t="script"></p>
    <p class="when" data-t="dots"></p>
    <p class="brand" data-i18n="brand"></p>
  </div>
</footer>

<template id="tpl-story"><article class="polaroid" data-anim="tilt"><i class="tape"></i><div class="pl-photo kb" data-f="photo"></div><div class="pl-body"><span class="pl-year" data-f="year"></span><span class="pl-season" data-f="season"></span><h3 data-f="title"></h3><p data-f="text"></p></div></article></template>
<template id="tpl-event"><li class="ev" data-anim="up"><span class="ev-ic"><svg data-f="icon"><use href="#i-star"/></svg></span><div class="ev-body"><span class="ev-time" data-f="time"></span><h3 data-f="title"></h3><p data-f="place"></p><a class="ev-map" data-f="map"><svg><use href="#i-pin"/></svg><span data-f="maptext"></span></a></div><div class="ev-pic" data-f="photo"></div></li></template>
<template id="tpl-detail"><div class="detail" data-anim="up"><span class="d-ic"><svg data-f="icon"><use href="#i-star"/></svg></span><div><h3 data-f="label"></h3><p data-f="value"></p></div></div></template>
<template id="tpl-photo"><li class="gal" data-anim="tilt" data-tap="hearts"><div class="gal-in kb" data-f="photo"></div></li></template>

<script src="js/config.js"></script>
<script src="../../assets/core/js/i18n.js"></script>
<script src="../../assets/core/js/icons.js"></script>
<script src="../../assets/core/js/fx.js"></script>
<script src="../../assets/core/js/music.js"></script>
<script src="../../assets/core/js/core.js"></script>
</body>
</html>
